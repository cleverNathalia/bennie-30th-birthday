<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>
html,body{margin:0;height:100%}
.wrap{display:flex;width:1280px;height:854px}
.main{flex:1;position:relative;background:#04050A;display:flex;align-items:center;justify-content:center;overflow:hidden}
.main::before{content:'';position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(180deg,rgba(0,240,255,.16),transparent)}
.main::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 4px,rgba(0,0,0,.3) 4px 6px);mix-blend-mode:multiply}
.mark{position:relative;z-index:2;font-family:var(--font-display);font-size:118px;line-height:1.02;letter-spacing:.03em;color:#EAFCFF;text-align:center;text-shadow:0 0 26px rgba(0,240,255,.6),0 0 62px rgba(255,46,136,.4)}
.strip{width:320px;display:flex;flex-direction:column}
.strip div{flex:1}
a{color:var(--cyan)}a:hover{color:var(--pink)}
</style></head><body>
<div class="wrap">
<div class="main"><div class="mark">CABINET<br>NO. 30</div></div>
<div class="strip"><div style="background:#9FFBFF"></div><div style="background:#00F0FF"></div><div style="background:#FF9CC4"></div><div style="background:#FF2E88"></div></div>
</div>
</body></html>
