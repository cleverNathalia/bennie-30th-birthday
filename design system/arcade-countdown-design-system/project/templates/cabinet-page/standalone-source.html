<x-dc>
<helmet><link rel="stylesheet" href="../../styles.css"><script src="../../_ds_bundle.js"></script><style>html,body{margin:0;min-height:100%;background:#04050A}</style></helmet>
<div style="position:relative;min-height:100vh;background:#04050A;font-family:'IBM Plex Mono',ui-monospace,monospace;color:#CFE9EF">
<div style="position:fixed;inset:-10%;pointer-events:none;z-index:59;background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.75) 100%)"></div>
<div style="position:fixed;inset:0;pointer-events:none;z-index:60;mix-blend-mode:multiply;background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.32) 2px 3px)"></div>
<div style="position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:34px 24px 80px">
<div style="position:relative;border:1px solid rgba(0,240,255,.18);background:linear-gradient(180deg,#151A2C,#080B16 60%,#0B0F1C);box-shadow:0 0 0 6px #0A0D18,0 0 0 7px #1D2439,0 26px 60px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);padding:30px 34px 26px;overflow:hidden">
<div style="position:absolute;left:0;right:0;top:0;height:110px;background:linear-gradient(180deg,rgba(0,240,255,.14),transparent)"></div>
<div style="position:absolute;left:8%;right:8%;bottom:-1px;height:2px;filter:blur(1px);background:linear-gradient(90deg,transparent,#FF2E88,transparent)"></div>
<div style="position:relative;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(0,240,255,.55)"><span>Cabinet No. 30</span><span>Dublin · 18:00 daily</span></div>
<h1 style="position:relative;margin:18px 0 12px;font-family:'Michroma',sans-serif;font-size:clamp(26px,5.4vw,58px);letter-spacing:.04em;line-height:1;color:#EAFCFF;text-shadow:0 0 18px rgba(0,240,255,.55),0 0 46px rgba(255,46,136,.35)">PLAYER ONE<br>TURNS THIRTY</h1>
<div style="position:relative;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#FF2E88;text-shadow:0 0 14px rgba(255,46,136,.6)">Eight cartridges · one unlocks a day</div>
</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(0,240,255,.18);border:1px solid rgba(0,240,255,.18);margin:18px 0 34px">
<div style="background:#080B14;padding:14px 18px"><div style="font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(207,233,239,.5)">Credits unlocked</div><div style="font-family:'Michroma',sans-serif;font-size:19px;margin-top:7px;color:#00F0FF;text-shadow:0 0 14px rgba(0,240,255,.55)">{{ credits }}</div></div>
<div style="background:#080B14;padding:14px 18px"><div style="font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(207,233,239,.5)">Next cartridge</div><div style="font-family:'Michroma',sans-serif;font-size:19px;margin-top:7px;color:#00F0FF;text-shadow:0 0 14px rgba(0,240,255,.55)">06:41:12</div></div>
<div style="background:#080B14;padding:14px 18px"><div style="font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(207,233,239,.5)">Time to birthday</div><div style="font-family:'Michroma',sans-serif;font-size:19px;margin-top:7px;color:#FF2E88;text-shadow:0 0 14px rgba(255,46,136,.6)">6D 04:12</div></div>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px">
<sc-for list="{{ slots }}" as="s" hint-placeholder-count="8">
<x-import component-from-global-scope="ArcadeCountdownDesignSystem_b791c4.CartridgeSlot" day="{{ s.day }}" state="{{ s.state }}" countdown="{{ s.countdown }}" still="{{ s.still }}" hint-size="100%,300px"></x-import>
</sc-for>
</div>
<div style="margin-top:34px;border:1px solid rgba(0,240,255,.18);background:linear-gradient(180deg,#151A2C,#090D18);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 50px rgba(0,0,0,.7);padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:26px;flex-wrap:wrap">
<div style="display:flex;align-items:center;gap:18px">
<div style="width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#FF9CC4,#FF2E88 45%,#8A0D43);box-shadow:0 0 22px rgba(255,46,136,.5),inset 0 -3px 6px rgba(0,0,0,.5)"></div>
<div style="width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#9FFBFF,#00F0FF 48%,#046A75);box-shadow:0 0 18px rgba(0,240,255,.4),inset 0 -3px 6px rgba(0,0,0,.45)"></div>
<div style="width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#9FFBFF,#00F0FF 48%,#046A75);box-shadow:0 0 18px rgba(0,240,255,.4),inset 0 -3px 6px rgba(0,0,0,.45)"></div>
</div>
<div style="font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(207,233,239,.5)">Press start · next cartridge loads at 18:00</div>
</div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:820},&quot;unlockedCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:0,&quot;max&quot;:8,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cabinet&quot;},&quot;stillUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Cabinet&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const unlocked = this.props.unlockedCount ?? 4;
    const still = this.props.stillUrl || (window.__resources && window.__resources.portrait) || '../../assets/bennie-portrait.png';
    const slots = Array.from({ length: 8 }, (_, i) => {
      const day = i + 1;
      const state = day < unlocked ? 'cleared' : day === unlocked ? 'ready' : 'locked';
      const away = day - unlocked;
      return {
        day, state,
        still: state === 'locked' ? undefined : still,
        countdown: state === 'locked' ? (away > 1 ? `${away - 1}D 06:41` : '06:41:12') : undefined,
      };
    });
    return { slots, credits: `0${Math.min(unlocked, 8)} / 08` };
  }
}
</script>
</body>
