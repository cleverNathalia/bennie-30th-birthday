<!-- @dsCard group="Spacing" viewport="700x146" name="Geometry" subtitle="Radius is zero everywhere except physical buttons" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--ink);color:var(--phos);font-family:var(--font-mono);padding:16px}
a{color:var(--cyan)}a:hover{color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.g{display:grid;gap:11px}
.sw{width:100px}.chip{height:52px;border:1px solid var(--hairline)}
.n{font-size:9px;letter-spacing:.18em;margin-top:6px;color:var(--phos-dim);text-transform:uppercase}
.v{font-size:8.5px;color:var(--phos-faint)}
.k{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--phos-faint)}
</style></head><body><div class="row" style="gap:22px;align-items:center;padding:12px 0">
<div style="width:96px;height:60px;border:1px solid var(--cyan-40);border-radius:0"></div>
<div style="width:60px;height:60px;border-radius:50%;background:var(--mat-button-cyan);box-shadow:var(--mat-button-shadow)"></div>
<div class="v" style="max-width:300px;line-height:2">--radius-none: 0 — panels, screens, glyph buttons, wells<br>--radius-button: 50% — joystick and deck buttons only</div>
</div></body></html>
