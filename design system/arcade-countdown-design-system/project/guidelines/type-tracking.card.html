<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--ink);color:var(--phos);font-family:var(--font-mono);padding:16px}
a{color:var(--cyan)}a:hover{color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.g{display:grid;gap:11px}
.sw{width:100px}.chip{height:52px;border:1px solid var(--hairline)}
.n{font-size:9px;letter-spacing:.18em;margin-top:6px;color:var(--phos-dim);text-transform:uppercase}
.v{font-size:8.5px;color:var(--phos-faint)}
.k{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--phos-faint)}
</style></head><body><div class="g">
<div style="font-family:var(--font-display);font-size:22px;letter-spacing:.04em;color:var(--phos-bright)">TURNS THIRTY</div><div class="v">display · .04em — Michroma is already wide</div>
<div style="font-size:10px;letter-spacing:.40em;text-transform:uppercase;color:var(--cyan-55);margin-top:8px">CABINET NO. 30</div><div class="v">widest · .40em — eyebrows</div>
<div style="font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--phos-dim)">TIME TO BIRTHDAY</div><div class="v">wide · .28em — kickers, notes</div>
<div style="font-size:9px;letter-spacing:.20em;text-transform:uppercase;color:var(--phos-dim)">CREDITS UNLOCKED</div><div class="v">label · .20em — field labels</div>
</div></body></html>
