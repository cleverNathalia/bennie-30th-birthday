<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--ink);color:var(--phos);font-family:var(--font-mono);padding:16px}
a{color:var(--cyan)}a:hover{color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.g{display:grid;gap:11px}
.sw{width:100px}.chip{height:52px;border:1px solid var(--hairline)}
.n{font-size:9px;letter-spacing:.18em;margin-top:6px;color:var(--phos-dim);text-transform:uppercase}
.v{font-size:8.5px;color:var(--phos-faint)}
.k{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--phos-faint)}
</style></head><body><div class="row" style="gap:26px;align-items:center;padding:14px 6px">
<div style="text-align:center"><div style="width:34px;height:34px;border-radius:50%;background:var(--mat-button-pink);box-shadow:var(--mat-button-shadow-pink)"></div><div class="n">joystick 34</div></div>
<div style="text-align:center"><div style="width:28px;height:28px;border-radius:50%;background:var(--mat-button-cyan);box-shadow:var(--mat-button-shadow)"></div><div class="n">button 28</div></div>
<div style="text-align:center"><div style="width:34px;height:34px;border:1px solid var(--cyan);background:rgba(0,0,0,.55);display:grid;place-items:center;color:var(--cyan);box-shadow:var(--glow-sm)">❯</div><div class="n">glyph · square</div></div>
<div class="v" style="max-width:230px;line-height:2">round = hardware on the deck<br>square = a control on a screen<br>never mix the two</div>
</div></body></html>
