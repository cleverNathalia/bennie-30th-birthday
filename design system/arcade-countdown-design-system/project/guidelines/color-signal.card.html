<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--ink);color:var(--phos);font-family:var(--font-mono);padding:16px}
a{color:var(--cyan)}a:hover{color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.g{display:grid;gap:11px}
.sw{width:100px}.chip{height:52px;border:1px solid var(--hairline)}
.n{font-size:9px;letter-spacing:.18em;margin-top:6px;color:var(--phos-dim);text-transform:uppercase}
.v{font-size:8.5px;color:var(--phos-faint)}
.k{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--phos-faint)}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:#00F0FF"></div><div class="n">cyan</div><div class="v">#00F0FF</div></div><div class="sw"><div class="chip" style="background:#9FFBFF"></div><div class="n">cyan-lit</div><div class="v">#9FFBFF</div></div><div class="sw"><div class="chip" style="background:#046A75"></div><div class="n">cyan-deep</div><div class="v">#046A75</div></div>
<div class="sw"><div class="chip" style="background:#FF2E88"></div><div class="n">pink</div><div class="v">#FF2E88</div></div><div class="sw"><div class="chip" style="background:#FF9CC4"></div><div class="n">pink-lit</div><div class="v">#FF9CC4</div></div><div class="sw"><div class="chip" style="background:#8A0D43"></div><div class="n">pink-deep</div><div class="v">#8A0D43</div></div>
</div></body></html>
