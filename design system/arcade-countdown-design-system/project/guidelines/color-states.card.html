<!-- @dsCard group="Colors" viewport="700x148" name="Slot states" subtitle="Cleared, ready, locked — separated by luminance, not just hue" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--ink);color:var(--phos);font-family:var(--font-mono);padding:16px}
a{color:var(--cyan)}a:hover{color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.g{display:grid;gap:11px}
.sw{width:100px}.chip{height:52px;border:1px solid var(--hairline)}
.n{font-size:9px;letter-spacing:.18em;margin-top:6px;color:var(--phos-dim);text-transform:uppercase}
.v{font-size:8.5px;color:var(--phos-faint)}
.k{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--phos-faint)}
</style></head><body><div class="row" style="align-items:stretch">
<div style="flex:1;padding:14px 16px;border:1px solid var(--cyan-40);background:linear-gradient(180deg,#1A2033,#0C101C);box-shadow:inset 0 1px 0 var(--sheen-2),0 0 26px var(--cyan-14)"><div class="k">Cleared</div><div style="font-family:var(--font-display);font-size:15px;color:var(--phos-bright);margin-top:9px">01</div><div class="v" style="margin-top:6px;color:var(--cyan-55)">screen lit · still visible</div></div>
<div style="flex:1;padding:14px 16px;border:1px solid var(--cyan-40);background:linear-gradient(180deg,#1A2033,#0C101C);box-shadow:inset 0 1px 0 var(--sheen-3),0 0 34px var(--cyan-22)"><div class="k">Ready</div><div style="font-family:var(--font-display);font-size:15px;color:var(--phos-bright);margin-top:9px">04</div><div class="v" style="margin-top:6px;color:var(--cyan-55)">same, labelled NEW</div></div>
<div style="flex:1;padding:14px 16px;border:1px solid var(--hairline);background:linear-gradient(180deg,#141A2C,#0B0F18)"><div class="k" style="color:var(--pink-50)">Locked</div><div style="font-family:var(--font-display);font-size:15px;color:var(--phos-faint);margin-top:9px">05</div><div class="v" style="margin-top:6px;color:var(--pink-50)">dead screen · standby ◼</div></div>
</div></body></html>
