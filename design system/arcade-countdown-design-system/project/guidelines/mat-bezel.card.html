<!-- @dsCard group="Materials" viewport="700x180" name="Bezel material" subtitle="Sheen, cast shadow, then glow — in that order" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--ink);color:var(--phos);font-family:var(--font-mono);padding:16px}
a{color:var(--cyan)}a:hover{color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.g{display:grid;gap:11px}
.sw{width:100px}.chip{height:52px;border:1px solid var(--hairline)}
.n{font-size:9px;letter-spacing:.18em;margin-top:6px;color:var(--phos-dim);text-transform:uppercase}
.v{font-size:8.5px;color:var(--phos-faint)}
.k{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--phos-faint)}
</style></head><body><div class="row" style="gap:20px;padding:6px 0">
<div style="flex:1;background:linear-gradient(180deg,#1A2033,#0C101C);border:1px solid var(--hairline);box-shadow:var(--mat-bezel);padding:11px"><div style="height:74px;background:var(--ink-deep);box-shadow:var(--mat-screen)"></div><div class="n">rest</div></div>
<div style="flex:1;background:linear-gradient(180deg,#1A2033,#0C101C);border:1px solid var(--hairline);box-shadow:var(--mat-bezel-hover);padding:11px"><div style="height:74px;background:var(--ink-deep);box-shadow:var(--mat-screen-on)"></div><div class="n">hover · lifted 6px</div></div>
<div style="flex:1.1"><div class="v" style="line-height:2">inset 0 1px 0 sheen<br>0 14px 34px cast<br>+ 0 0 32px cyan-22 on hover<br><br>never a single flat shadow</div></div>
</div></body></html>
