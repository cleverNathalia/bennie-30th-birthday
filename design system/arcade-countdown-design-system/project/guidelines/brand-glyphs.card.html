<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--ink);color:var(--phos);font-family:var(--font-mono);padding:16px}
a{color:var(--cyan)}a:hover{color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.g{display:grid;gap:11px}
.sw{width:100px}.chip{height:52px;border:1px solid var(--hairline)}
.n{font-size:9px;letter-spacing:.18em;margin-top:6px;color:var(--phos-dim);text-transform:uppercase}
.v{font-size:8.5px;color:var(--phos-faint)}
.k{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--phos-faint)}
</style></head><body><div class="row" style="gap:30px;align-items:flex-end;padding:8px 0">
<div style="text-align:center;width:62px"><div style="font-size:20px;color:var(--cyan);line-height:1.3">▶</div><div class="n">play</div></div><div style="text-align:center;width:62px"><div style="font-size:20px;color:var(--pink);line-height:1.3">◼</div><div class="n">standby</div></div><div style="text-align:center;width:62px"><div style="font-size:17px;color:var(--pink);line-height:1.3">✕</div><div class="n">close</div></div><div style="text-align:center;width:62px"><div style="font-size:15px;color:var(--cyan);line-height:1.3">❮</div><div class="n">prev</div></div><div style="text-align:center;width:62px"><div style="font-size:15px;color:var(--cyan);line-height:1.3">❯</div><div class="n">next</div></div><div style="text-align:center;width:62px"><div style="font-size:15px;color:var(--cyan-55);line-height:1.3">◀</div><div class="n">back</div></div>
<div class="v" style="max-width:210px;line-height:2">Unicode geometric only.<br>The old system's 🔒 and ✨ are gone.</div>
</div></body></html>
