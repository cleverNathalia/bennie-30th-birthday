<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--ink);color:var(--phos);font-family:var(--font-mono);padding:16px}
a{color:var(--cyan)}a:hover{color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.g{display:grid;gap:11px}
.sw{width:100px}.chip{height:52px;border:1px solid var(--hairline)}
.n{font-size:9px;letter-spacing:.18em;margin-top:6px;color:var(--phos-dim);text-transform:uppercase}
.v{font-size:8.5px;color:var(--phos-faint)}
.k{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--phos-faint)}
</style></head><body><div class="g" style="gap:5px;font-size:11px">
<div style="display:flex;gap:14px"><div style="width:110px;color:var(--cyan-55)">shell max</div><div style="width:230px;color:var(--phos)">1180px</div><div class="v">padding 34 / 24 / 80</div></div><div style="display:flex;gap:14px"><div style="width:110px;color:var(--cyan-55)">rack</div><div style="width:230px;color:var(--phos)">auto-fit minmax(190px,1fr)</div><div class="v">4 → 2 → 1, fluid</div></div><div style="display:flex;gap:14px"><div style="width:110px;color:var(--cyan-55)">rack gap</div><div style="width:230px;color:var(--phos)">18px</div><div class="v"></div></div><div style="display:flex;gap:14px"><div style="width:110px;color:var(--cyan-55)">slot ratio</div><div style="width:230px;color:var(--phos)">3 / 4</div><div class="v">screen well only</div></div><div style="display:flex;gap:14px"><div style="width:110px;color:var(--cyan-55)">bezel pad</div><div style="width:230px;color:var(--phos)">11px 11px 13px</div><div class="v">bottom is 2px deeper</div></div><div style="display:flex;gap:14px"><div style="width:110px;color:var(--cyan-55)">marquee pad</div><div style="width:230px;color:var(--phos)">30 34 26</div><div class="v"></div></div><div style="display:flex;gap:14px"><div style="width:110px;color:var(--cyan-55)">day view max</div><div style="width:230px;color:var(--phos)">940px</div><div class="v">62ch measure on body copy</div></div>
</div></body></html>
