<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--ink);color:var(--phos);font-family:var(--font-mono);padding:16px}

.row{display:flex;gap:10px;flex-wrap:wrap}.g{display:grid;gap:11px}
.sw{width:100px}.chip{height:52px;border:1px solid var(--hairline)}
.n{font-size:9px;letter-spacing:.18em;margin-top:6px;color:var(--phos-dim);text-transform:uppercase}
.v{font-size:8.5px;color:var(--phos-faint)}
.k{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--phos-faint)}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:#04050A;border-color:var(--edge)"></div><div class="n">ink</div><div class="v">#04050A</div></div><div class="sw"><div class="chip" style="background:#03060C;border-color:var(--edge)"></div><div class="n">ink-deep</div><div class="v">#03060C</div></div>
<div class="sw"><div class="chip" style="background:#1A2033"></div><div class="n">steel-hi</div><div class="v">#1A2033</div></div><div class="sw"><div class="chip" style="background:#141A2C"></div><div class="n">steel-face</div><div class="v">#141A2C</div></div><div class="sw"><div class="chip" style="background:#0C101C"></div><div class="n">steel-lo</div><div class="v">#0C101C</div></div><div class="sw"><div class="chip" style="background:#080B14"></div><div class="n">steel-shadow</div><div class="v">#080B14</div></div><div class="sw"><div class="chip" style="background:#1D2439"></div><div class="n">steel-line</div><div class="v">#1D2439</div></div>
</div></body></html>
