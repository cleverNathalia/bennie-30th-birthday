<!-- @dsCard group="Materials" viewport="700x160" name="CRT glass" subtitle="Scanline multiply plus a corner vignette — applied to the page" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--ink);color:var(--phos);font-family:var(--font-mono);padding:16px}
a{color:var(--cyan)}a:hover{color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.g{display:grid;gap:11px}
.sw{width:100px}.chip{height:52px;border:1px solid var(--hairline)}
.n{font-size:9px;letter-spacing:.18em;margin-top:6px;color:var(--phos-dim);text-transform:uppercase}
.v{font-size:8.5px;color:var(--phos-faint)}
.k{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--phos-faint)}
</style></head><body><div style="position:relative;height:124px;background:linear-gradient(120deg,#0d1626,#1a2740)">
<div style="position:absolute;inset:0;background:var(--crt-scanlines);mix-blend-mode:multiply"></div>
<div style="position:absolute;inset:0;background:var(--crt-vignette)"></div>
<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--phos-dim)">2px on · 1px off · multiply</div>
</div></body></html>
