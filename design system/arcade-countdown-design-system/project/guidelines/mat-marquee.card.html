<!-- @dsCard group="Materials" viewport="700x170" name="Marquee lightbox" subtitle="Black moulding ring, cyan backlight bleed, pink filament" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--ink);color:var(--phos);font-family:var(--font-mono);padding:16px}
a{color:var(--cyan)}a:hover{color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.g{display:grid;gap:11px}
.sw{width:100px}.chip{height:52px;border:1px solid var(--hairline)}
.n{font-size:9px;letter-spacing:.18em;margin-top:6px;color:var(--phos-dim);text-transform:uppercase}
.v{font-size:8.5px;color:var(--phos-faint)}
.k{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--phos-faint)}
</style></head><body><div style="padding:12px 10px"><div style="position:relative;border:1px solid var(--edge);background:var(--surface-marquee);box-shadow:var(--mat-marquee);padding:22px 24px 20px;overflow:hidden">
<div style="position:absolute;left:0;right:0;top:0;height:70px;background:var(--marquee-backlight)"></div>
<div style="position:absolute;left:8%;right:8%;bottom:-1px;height:2px;background:var(--marquee-underline);filter:blur(1px)"></div>
<div style="position:relative;font-family:var(--font-display);font-size:20px;color:var(--phos-bright);text-shadow:var(--glow-text)">MARQUEE</div>
</div></div></body></html>
