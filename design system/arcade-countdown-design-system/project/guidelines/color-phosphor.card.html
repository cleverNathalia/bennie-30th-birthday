<!-- @dsCard group="Colors" viewport="700x150" name="Phosphor text" subtitle="Text is a warm-grey phosphor, not cyan. Only lit parts are cyan." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--ink);color:var(--phos);font-family:var(--font-mono);padding:16px}
a{color:var(--cyan)}a:hover{color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.g{display:grid;gap:11px}
.sw{width:100px}.chip{height:52px;border:1px solid var(--hairline)}
.n{font-size:9px;letter-spacing:.18em;margin-top:6px;color:var(--phos-dim);text-transform:uppercase}
.v{font-size:8.5px;color:var(--phos-faint)}
.k{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--phos-faint)}
</style></head><body><div class="g">
<div style="font-size:15px;color:var(--phos-bright)">phos-bright — headings, numerals</div>
<div style="font-size:14px;color:var(--phos)">phos — body copy, the default</div>
<div style="font-size:13px;color:var(--phos-dim)">phos-dim — field labels</div>
<div style="font-size:13px;color:var(--phos-faint)">phos-faint — a locked day's number</div>
<div style="font-size:13px;color:var(--cyan)">cyan — reserved for lit UI, never body copy</div>
</div></body></html>
