<!-- @dsCard group="Type" viewport="700x170" name="When type glows" subtitle="Three glows only, and body copy is never one of them" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--ink);color:var(--phos);font-family:var(--font-mono);padding:16px}
a{color:var(--cyan)}a:hover{color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.g{display:grid;gap:11px}
.sw{width:100px}.chip{height:52px;border:1px solid var(--hairline)}
.n{font-size:9px;letter-spacing:.18em;margin-top:6px;color:var(--phos-dim);text-transform:uppercase}
.v{font-size:8.5px;color:var(--phos-faint)}
.k{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--phos-faint)}
</style></head><body><div class="g">
<div style="font-family:var(--font-display);font-size:20px;color:var(--phos-bright);text-shadow:var(--glow-text)">MARQUEE — cyan 18 + pink 46</div>
<div style="font-family:var(--font-display);font-size:17px;color:var(--cyan);text-shadow:var(--glow-text-sm)">STAT VALUE — cyan 14</div>
<div style="font-size:13px;color:var(--pink);text-shadow:var(--glow-text-pink)">Countdown — pink 14</div>
<div style="font-size:14px;color:var(--phos);line-height:1.7">Body copy — no glow, ever. This is where the design gets out of the way.</div>
</div></body></html>
